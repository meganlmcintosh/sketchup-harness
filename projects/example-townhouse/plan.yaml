# Example: two-storey townhouse on a narrow lot.
# All bare numbers are millimetres. x runs east, y runs north; the origin is the
# south-west corner of the building. See docs/plan-spec.md for every option.

project:
  name: Example Townhouse
  address: 12 Sample Street, Brunswick VIC
  north: 0 # degrees clockwise from plan-up to true north

storeys:
  - name: Ground Floor
    height: 2700
    walls:
      - id: GF-EXT
        type: brick_veneer
        closed: true
        align: outside # the points trace the outside face; overall 8000 x 13000
        points: [[0, 0], [8000, 0], [8000, 13000], [0, 13000]]
      - { id: GF-STUDY-E, type: stud_internal, points: [[4000, 250], [4000, 4000]] }
      - { id: GF-STUDY-N, type: stud_internal, points: [[250, 4000], [4055, 4000]] }
      - { id: GF-SERV-E, type: stud_internal, points: [[2500, 4000], [2500, 7355]] }
      - { id: GF-SERV-N, type: stud_internal, points: [[250, 7300], [2555, 7300]] }
      - { id: GF-LDRY-N, type: stud_internal, points: [[250, 5900], [2500, 5900]] }
    separators:
      - [[4055, 4000], [7750, 4000]] # the entry opens into the living area here
    slab_extensions:
      - [[5000, -1500], [7000, -1500], [7000, 0], [5000, 0]] # front porch
    rooms:
      - { name: Porch, at: [6000, -750] }
      - { name: Study, at: [2000, 2000] }
      - { name: Entry, at: [5800, 2000], floor: tiles_light }
      - { name: Laundry, at: [1300, 4800] }
      - { name: WC, at: [1300, 6600] }
      - { name: Kitchen / Living / Dining, at: [5000, 9000] }
    openings:
      - { type: entry_door, at: [6000, 0] }
      - { type: window, at: [2000, 0], width: 1810 }
      - { type: door, at: [4000, 2500] }
      - { type: door, at: [2500, 4800], width: 720 }
      - { type: door, at: [2500, 6600], width: 720, into: Kitchen / Living / Dining } # WC doors swing out
      - { type: door, at: [0, 4500], into: Laundry }
      - { type: sliding_door, at: [3000, 13000], width: 3010 }
      - { type: window, at: [6300, 13000], width: 1810, height: 900 }
      - { type: window, at: [0, 9500], width: 1810 }
    stairs:
      - { type: straight, start: [7250, 4300], direction: north, width: 1000 }
    items:
      - { type: desk, room: Study, against: west, offset: 1200 }
      - { type: bookshelf, room: Study, against: north, offset: 500, length: 1800 }
      - { type: plant, at: [3500, 650] }
      - { type: plant, at: [4600, 800] }
      - { type: laundry_trough, room: Laundry, against: north, offset: 0 }
      - { type: washing_machine, room: Laundry, against: north, offset: 900 }
      - { type: dryer, room: Laundry, against: north, offset: 1550 }
      - { type: toilet, room: WC, against: north }
      # Kitchen along the north wall, sink under the window; no overheads over the window.
      - { type: kitchen_bench, room: Kitchen / Living / Dining, against: north, offset: 4350, length: 3150,
          overheads: false, sink: 1700, cooktop: 800 }
      - { type: fridge, room: Kitchen / Living / Dining, against: east, offset: 7045 }
      - { type: pantry, room: Kitchen / Living / Dining, against: east, offset: 6345 }
      - { type: kitchen_island, at: [5500, 10600], facing: south, length: 2400, stools: 3 }
      - { type: dining_table, seats: 6, at: [2200, 11000], facing: east }
      - { type: tv_unit, at: [1500, 7580], facing: north }
      - { type: rug, at: [1500, 8350], length: 2200, depth: 1600 }
      - { type: coffee_table, at: [1500, 8300], facing: south }
      - { type: sofa, seats: 3, at: [1500, 9300], facing: south }
      - { type: armchair, at: [3300, 8300], facing: west }
      - { type: plant, at: [6300, 4800] }

  - name: First Floor
    walls:
      - id: FF-EXT
        type: clad_frame
        closed: true
        align: outside
        points: [[0, 0], [8000, 0], [8000, 13000], [0, 13000]]
      - { id: FF-BEDS-N, type: stud_internal, points: [[140, 4500], [7860, 4500]] }
      - { id: FF-BEDS-MID, type: stud_internal, points: [[4000, 140], [4000, 4500]] }
      - { id: FF-BATH-N, type: stud_internal, points: [[140, 7000], [3055, 7000]] }
      - { id: FF-BATH-E, type: stud_internal, points: [[3000, 4500], [3000, 7055]] }
      - { id: FF-BED1-S, type: stud_internal, points: [[140, 9300], [7860, 9300]] }
      - { id: FF-ENS-E, type: stud_internal, points: [[2500, 9300], [2500, 12860]] }
      - { id: FF-ENS-S, type: stud_internal, points: [[140, 11000], [2555, 11000]] }
    rooms:
      - { name: Bed 2, at: [2000, 2000] }
      - { name: Bed 3, at: [6000, 2000] }
      - { name: Bathroom, at: [1500, 5800] }
      - { name: Hall, at: [5000, 8000] }
      - { name: Bed 1, at: [5200, 11000] }
      - { name: WIR, at: [1300, 10150] }
      - { name: Ensuite, at: [1300, 11950] }
    openings:
      - { type: door, at: [3500, 4500] }
      - { type: door, at: [4600, 4500] }
      - { type: door, at: [3000, 5800] }
      - { type: door, at: [5000, 9300], into: Bed 1 }
      - { type: door, at: [2500, 10150], width: 720 }
      - { type: door, at: [2500, 11950], width: 720 }
      - { type: window, at: [5200, 13000], width: 2410 }
      - { type: window, at: [1300, 13000], width: 610, height: 610 }
      - { type: window, at: [2000, 0], width: 1810 }
      - { type: window, at: [6000, 0], width: 1810 }
      - { type: window, at: [0, 5800], width: 1210, height: 610 }
      - { type: window, at: [8000, 7000], width: 1210 } # over the stair
    items:
      - { type: bed, size: queen, room: Bed 2, against: west }
      - { type: bedside_table, room: Bed 2, against: west, offset: 897 }
      - { type: bedside_table, room: Bed 2, against: west, offset: 2957 }
      - { type: robe, room: Bed 2, against: east, offset: 400 }
      - { type: bed, size: queen, room: Bed 3, against: east }
      - { type: bedside_table, room: Bed 3, against: east, offset: 897 }
      - { type: bedside_table, room: Bed 3, against: east, offset: 2957 }
      - { type: robe, room: Bed 3, against: west, offset: 400 }
      - { type: bed, size: king, room: Bed 1, against: east }
      - { type: bedside_table, room: Bed 1, against: east, offset: 347 }
      - { type: bedside_table, room: Bed 1, against: east, offset: 2707 }
      - { type: tallboy, room: Bed 1, against: west, offset: 1500 }
      - { type: plant, at: [3200, 12300] }
      - { type: robe, room: WIR, against: west, offset: 45, length: 1500 }
      - { type: shower, room: Ensuite, against: north, offset: 0 }
      - { type: vanity, room: Ensuite, against: west, offset: 0 }
      - { type: toilet, room: Ensuite, against: south, offset: 800 }
      - { type: bath, room: Bathroom, against: north, offset: 0 }
      - { type: vanity, room: Bathroom, against: south, offset: 200, length: 1200, basins: 2 }
      - { type: shower, room: Bathroom, against: east, offset: 0, width: 800 }
      - { type: toilet, room: Bathroom, against: west, offset: 900 }
      - { type: plant, at: [4200, 8800] }

roof:
  - { type: hip, over: First Floor, pitch: 22.5, eaves: 450 }
  - type: skillion # porch roof
    over: Ground Floor
    outline: [[5000, -1500], [7000, -1500], [7000, 0], [5000, 0]]
    down: south
    pitch: 5
    eaves: 150
